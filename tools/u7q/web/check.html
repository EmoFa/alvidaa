<!DOCTYPE html><html><head><meta charset="utf-8"><title>vidaa install check</title></head>
<body style="background:#111;color:#0f0;font:13px monospace"><pre id="o">START</pre>
<script>
/* Poll the installer log + dropbear state after the superwatch install. */
var O = document.getElementById('o');
function log(m){ O.textContent += "\n" + m; }
function post(t){ try{ var x=new XMLHttpRequest(); x.open("POST","/recon",false);
  x.setRequestHeader("Content-Type","text/plain"); x.send(t); }catch(e){} }
function fr(p){
  try{
    var r = vowOS.service.syncExecute("hiutils", {api:"fileRead", args:{mode:6, path:p}});
    var m = r.msg;
    if (m != null && typeof m !== "string") { try { m = JSON.stringify(m); } catch(e) { m = String(m); } }
    return { ret: r.ret, msg: (m==null?"":String(m)) };
  }catch(e){ return { ret:false, msg:"EXC "+e.message }; }
}
function snapshot(){
  var d = fr(".re_sshd/");
  var l = fr(".re_sshd/installer_log.txt");
  var p = fr(".re_sshd/dropbear.pid");
  return { dir: d.ret ? "EXISTS" : d.msg.slice(0,60),
           log: l.ret ? l.msg : "MISSING(" + d.msg.slice(0,40) + ")",
           pid: p.ret ? p.msg : "-" };
}
var N = 10, i = 0, out = [];
function tick(){
  var s = snapshot();
  var line = "t=" + i + " dir=" + s.dir + " pid=" + s.pid + " log=" + (s.log.length > 500 ? s.log.slice(0,500)+"..." : s.log);
  out.push(line); log(line);
  if (s.log.indexOf("pid=") !== -1 || i >= N-1) { post("CHECK\n" + out.join("\n")); return; }
  i++; setTimeout(tick, 2000);
}
setTimeout(tick, 1000);
</script></body></html>
