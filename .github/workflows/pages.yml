name: pages

# Builds the docs site from the markdown in place (scripts/gen-site.py) and
# publishes it to GitHub Pages. Nothing is moved or duplicated in the tree:
# the generator maps README.md -> index.html, docs/**/README.md -> index.html,
# and rewrites relative links so the site works under /<repo>/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install markdown
        run: python3 -m pip install --disable-pip-version-check markdown==3.9

      - name: Build site
        run: python3 scripts/gen-site.py --out site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
