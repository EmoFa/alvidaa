[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fwmap"
version = "0.1.0"
description = "Catalog publicly linked firmware metadata on configured vendor sites"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
render = ["playwright>=1.40"]
test = ["pytest>=8"]

[project.scripts]
fwmap = "fwmap.cli:main"

[tool.setuptools]
packages = ["fwmap"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
