<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Home</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
// alvidaa v1.3: 1080p HiDPI canvas (logical 960x540 scaled 2x, ?540p fallback),
// localStorage instant cold-paint cache, smart initial focus (active HDMI signal
// or last-used tile), optional auto-switch countdown, 1-9 remote hotkeys,
// idle redraw throttling (once per minute instead of 1Hz), and self-install.

var cv = document.getElementById("c");
var ctx = cv.getContext("2d");
var W = 960, H = 540;
var SCALE = /[?&]540p/.test(location.search) ? 1 : 2;
cv.width = W * SCALE;
cv.height = H * SCALE;

var CACHE_KEY = "alvidaa_cache_v1";
var LAST_KEY = "alvidaa_last_v1";

// ---------------------------------------------------------------- state
var S = {
  apps: null, sources: null, shortcuts: [], state: null, serverInstalled: false,
  online: false, hello: false,
  row: 0, col: 0,            // focus: row 0 = inputs, row 1 = apps, row 2 = install
  toast: "", toastUntil: 0,
  busy: false,
  focusPicked: false, liveReceived: false, userInteracted: false,
  autoSwitchId: null, autoSwitchName: "", autoSwitchAt: 0
};

function loadCache() {
  try {
    var raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return;
    var c = JSON.parse(raw);
    if (c && (c.apps || c.sources)) {
      S.apps = c.apps || [];
      S.sources = c.sources || [];
      S.shortcuts = c.shortcuts || [];
      S.serverInstalled = !!c.installed;
      S.hello = true;
      preloadIcons();
      pickInitialFocus(false);
    }
  } catch (e) {}
}

function saveCache() {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      apps: S.apps,
      sources: S.sources,
      shortcuts: S.shortcuts,
      installed: S.serverInstalled
    }));
  } catch (e) {}
}

function saveLastUsed(row, val) {
  if (!val) return;
  try {
    localStorage.setItem(LAST_KEY, JSON.stringify({ row: row, val: val }));
  } catch (e) {}
}

function getLastUsed() {
  try {
    var raw = localStorage.getItem(LAST_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

var BRIDGE = { hiutils: false, legacy: false, checked: false };
function detectBridge() {
  if (BRIDGE.checked) return BRIDGE;
  BRIDGE.checked = true;
  BRIDGE.hiutils = typeof HiUtils_createRequest !== "undefined";
  BRIDGE.legacy = typeof Hisense_installApp !== "undefined";
  return BRIDGE;
}

var ROWS = ["inputs", "apps"];
var PAGE = 5;

function pickInitialFocus(fromLiveHello) {
  if (S.focusPicked && !fromLiveHello) return;
  var srcs = S.sources || [];
  // 1. Prefer the first HDMI/input with an active signal
  var activeIdx = -1;
  var activeCount = 0;
  for (var i = 0; i < srcs.length; i++) {
    if (srcs[i].signal) {
      if (activeIdx < 0) activeIdx = i;
      activeCount++;
    }
  }
  if (activeIdx >= 0) {
    S.row = 0;
    S.col = activeIdx;
    S.focusPicked = true;
    // Optional auto-switch when ?autosource is set (or server config enables autoSwitch)
    if (fromLiveHello && (/[?&]autosource/.test(location.search) || S.autoSwitchCfg) && activeCount === 1 && !S.autoSwitchAt) {
      S.autoSwitchId = srcs[activeIdx].id;
      S.autoSwitchName = srcs[activeIdx].name || srcs[activeIdx].id;
      S.autoSwitchAt = Date.now() + 3500;
    }
    return;
  }
  // 2. Otherwise restore the last-used tile from localStorage
  var last = getLastUsed();
  if (last) {
    var list = items(last.row);
    for (var j = 0; j < list.length; j++) {
      if (list[j].val === last.val || list[j].shortcut === last.val) {
        S.row = last.row;
        S.col = j;
        S.focusPicked = true;
        return;
      }
    }
  }
  clampFocus();
}

function cancelAutoSwitch() {
  if (S.autoSwitchAt) {
    S.autoSwitchAt = 0;
    S.autoSwitchId = null;
    S.toast = "auto-switch cancelled";
    S.toastUntil = Date.now() + 1800;
    draw();
  }
}

// ---------------------------------------------------------------- websocket
var ws = null, wsRetry = 0;

function connect() {
  var host = location.host || window.location.hostname + ":8770";
  try { ws = new WebSocket("ws://" + host + "/ws"); } catch (e) { scheduleReconnect(); return; }
  ws.onopen = function () { S.online = true; wsRetry = 0; draw(); };
  ws.onmessage = function (ev) {
    var m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.t === "hello") {
      var firstLive = !S.liveReceived;
      S.liveReceived = true;
      S.hello = true;
      S.serverInstalled = !!m.installed;
      S.apps = m.apps || S.apps || [];
      S.shortcuts = m.shortcuts || S.shortcuts || [];
      S.sources = m.sources || S.sources || [];
      S.state = m.state;
      S.autoSwitchCfg = !!m.autoSwitch;
      S.busy = false;
      saveCache();
      preloadIcons();
      if (firstLive && !S.userInteracted) pickInitialFocus(true);
      clampFocus(); draw();
    } else if (m.t === "tvstate") {
      S.state = m.state; draw();
    } else if (m.t === "sources") {
      S.sources = m.sources || S.sources;
      if (S.autoSwitchAt) {
        var active = (S.sources || []).filter(function (s) { return s.signal; });
        if (active.length !== 1 || active[0].id !== S.autoSwitchId) cancelAutoSwitch();
      }
      saveCache();
      clampFocus(); draw();
    } else if (m.t === "apps") {
      S.apps = m.apps || S.apps;
      S.shortcuts = m.shortcuts || S.shortcuts;
      saveCache();
      preloadIcons();
      clampFocus(); draw();
    } else if (typeof m.ok === "boolean" && S.busy) {
      S.busy = false;
      S.toast = m.ok ? "opening…" : (m.error || "could not open");
      S.toastUntil = Date.now() + 2500;
      draw();
    }
  };
  ws.onclose = function () {
    S.online = false;
    if (S.autoSwitchAt) cancelAutoSwitch();
    if (S.busy) {
      S.busy = false;
      S.toast = "connection lost";
      S.toastUntil = Date.now() + 2500;
    }
    scheduleReconnect(); draw();
  };
  ws.onerror = function () { try { ws.close(); } catch (e) {} };
}
function scheduleReconnect() {
  var d = Math.min(8000, 1000 * Math.pow(2, wsRetry++));
  setTimeout(connect, d);
}

function send(obj) {
  if (!S.online || !ws || ws.readyState !== 1) return false;
  try { ws.send(JSON.stringify(obj)); return true; } catch (e) { return false; }
}
function act(type, val) {
  if (S.busy) return;
  if (!send({ t: type === "launch" ? "launch" : "source", name: val, id: val })) {
    S.toast = "server offline - reconnecting";
    S.toastUntil = Date.now() + 2500;
    draw();
    return;
  }
  S.busy = true;
  saveLastUsed(type === "source" ? 0 : 1, val);
  S.toast = "…"; S.toastUntil = Date.now() + 2500;
  draw();
}

// ---------------------------------------------------------------- icons
var ICONS = {};
function preloadIcons() {
  var list = S.apps || [];
  for (var i = 0; i < list.length; i++) {
    var src = list[i].icon;
    if (!src || ICONS[src]) continue;
    var im = new Image();
    im.onload = function () { draw(); };
    im.src = src;
    ICONS[src] = im;
  }
}

// ---------------------------------------------------------------- layout
var F = {
  clock: "300 58px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
  mid: "500 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
  small: "500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
  tiny: "600 10px monospace",
  label: "600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
  letter: "600 38px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
};

function tileW() { return 160; }
function tileH() { return 88; }
function gap() { return 12; }
function left() { return 48; }

function items(row) {
  if (row === 0) {
    return (S.sources || []).map(function (s) {
      return { label: s.name || s.id, sub: s.signal ? "signal" : "no signal",
               signal: s.signal, glyph: s.glyph || "", val: s.id };
    });
  }
  var out = (S.apps || []).map(function (a) {
    return { label: a.name, sub: "", icon: a.icon, val: a.name };
  });
  var scs = S.shortcuts || [];
  for (var i = 0; i < scs.length; i++) {
    out.push({ label: scs[i].name, glyph: scs[i].glyph || "\u2605",
               shortcut: scs[i].url, sub: "", val: null });
  }
  return out;
}

function installVisible() {
  if (S.serverInstalled && !/[?&]setup/.test(location.search)) return false;
  var b = detectBridge();
  return (b.hiutils || b.legacy) && !S.installed;
}

function clampFocus() {
  var rows = installVisible() ? 3 : 2;
  if (S.row >= rows) S.row = rows - 1;
  var n = items(S.row).length;
  if (S.col >= n) S.col = Math.max(0, n - 1);
}

function rowStart(idx) {
  var n = items(idx).length;
  if (n <= PAGE) return 0;
  return Math.max(0, Math.min(S.col - 2, n - PAGE));
}

function hue(s) {
  var h = 0;
  for (var i = 0; i < (s || "").length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
  return h;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

var BG = null;
var bgim = new Image();
bgim.onload = function () { BG = bgim; draw(); };
bgim.src = "/bg/bg" + (new Date().getDate() % 3 + 1) + ".png";

var HIT = [];

// focus animation (scale the focused tile up with an ease-out)
var focusAnim = 1, lastFocusKey = "";
var rafPending = false;
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
function bumpFocus() {
  if (rafPending) return;
  rafPending = true;
  function tick() {
    focusAnim = Math.min(1, focusAnim + 0.14);
    draw();
    if (focusAnim < 1) requestAnimationFrame(tick);
    else rafPending = false;
  }
  requestAnimationFrame(tick);
}

function drawTile(x, y, focused, it, hotkeyNum) {
  var scale = focused ? 1 + 0.08 * easeOut(focusAnim) : 1;
  ctx.save();
  if (scale !== 1) {
    var cx = x + tileW() / 2, cy = y + tileH() / 2;
    ctx.translate(cx, cy); ctx.scale(scale, scale); ctx.translate(-cx, -cy);
  }

  // 2026 Dark Glass / Elevated Card Surface
  if (focused) {
    // 1. Multi-layer ambient bloom glow behind focused card
    var glow = ctx.createRadialGradient(
      x + tileW() / 2, y + tileH() / 2, tileW() * 0.15,
      x + tileW() / 2, y + tileH() / 2, tileW() * 0.8
    );
    glow.addColorStop(0, "rgba(56, 189, 248, 0.28)");
    glow.addColorStop(0.65, "rgba(99, 102, 241, 0.1)");
    glow.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = glow;
    roundRect(x - 16, y - 12, tileW() + 32, tileH() + 24, 20);
    ctx.fill();

    // 2. Focused drop shadow
    ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
    roundRect(x, y + 6, tileW(), tileH(), 16);
    ctx.fill();

    // 3. Crisp luminous border
    ctx.fillStyle = "#ffffff";
    roundRect(x - 2, y - 2, tileW() + 4, tileH() + 4, 16);
    ctx.fill();
  } else {
    // Rest state: subtle card shadow + hairline specular border
    ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
    roundRect(x, y + 4, tileW(), tileH(), 14);
    ctx.fill();

    ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
    roundRect(x - 1, y - 1, tileW() + 2, tileH() + 2, 15);
    ctx.fill();
  }

  if (it.install) {  // setup tile: two-line label, no icon
    ctx.fillStyle = focused ? "#1e293b" : "#111827";
    roundRect(x, y, tileW(), tileH(), 14);
    ctx.fill();
    ctx.fillStyle = focused ? "#f8fafc" : "#cbd5e1";
    ctx.font = F.small;
    ctx.textAlign = "center";
    ctx.fillText("＋ INSTALL", x + tileW() / 2, y + tileH() / 2 - 4);
    ctx.fillText("AS APP", x + tileW() / 2, y + tileH() / 2 + 16);
    ctx.textAlign = "left";
    ctx.restore();
    return;
  }

  var base = it.icon && ICONS[it.icon] && ICONS[it.icon].complete && ICONS[it.icon].naturalWidth;
  var cardGrad = ctx.createLinearGradient(x, y, x, y + tileH());
  if (focused) {
    cardGrad.addColorStop(0, "#222c3c");
    cardGrad.addColorStop(1, "#141b24");
  } else {
    cardGrad.addColorStop(0, base ? "#171d27" : "hsl(" + hue(it.label) + ",22%,14%)");
    cardGrad.addColorStop(1, "#0f131a");
  }
  ctx.fillStyle = cardGrad;
  roundRect(x, y, tileW(), tileH(), 14);
  ctx.fill();

  if (focused) {
    // 2026 Cyan Neon Pill Accent at bottom
    var pillGrad = ctx.createLinearGradient(x + 20, y, x + tileW() - 20, y);
    pillGrad.addColorStop(0, "#38bdf8");
    pillGrad.addColorStop(0.5, "#818cf8");
    pillGrad.addColorStop(1, "#38bdf8");
    ctx.fillStyle = pillGrad;
    roundRect(x + (tileW() - 44) / 2, y + tileH() - 5, 44, 3, 1.5);
    ctx.fill();
  }

  // Hotkey numeral (1-9)
  if (hotkeyNum >= 1 && hotkeyNum <= 9) {
    ctx.font = F.tiny;
    ctx.textAlign = "right";
    ctx.fillStyle = focused ? "rgba(248,250,252,0.6)" : "rgba(148,163,184,0.3)";
    ctx.fillText(String(hotkeyNum), x + tileW() - 8, y + 14);
    ctx.textAlign = "left";
  }

  // Tile Graphic (Glyph, Preloaded Icon, or Modern Letter Badge)
  if (it.glyph) {
    ctx.font = "38px sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = focused ? "#f8fafc" : "#cbd5e1";
    ctx.fillText(it.glyph, x + tileW() / 2, y + tileH() / 2 + 8);
    ctx.textAlign = "left";
  } else if (base) {
    var im = ICONS[it.icon];
    var boxW = tileW() - 24, boxH = tileH() - (it.sub ? 40 : 28);
    var s = Math.min(boxW / im.naturalWidth, boxH / im.naturalHeight);
    var dw = im.naturalWidth * s, dh = im.naturalHeight * s;
    ctx.drawImage(im, x + (tileW() - dw) / 2, y + (boxH - dh) / 2 + 4, dw, dh);
  } else {
    ctx.fillStyle = focused ? "rgba(248,250,252,0.85)" : "rgba(203,213,225,0.22)";
    ctx.font = F.letter;
    ctx.textAlign = "center";
    ctx.fillText((it.label || "?").charAt(0).toUpperCase(), x + tileW() / 2, y + tileH() / 2 + 12);
    ctx.textAlign = "left";
  }

  // Label text with ellipsis truncation
  ctx.fillStyle = focused ? "#f8fafc" : "#94a3b8";
  ctx.font = F.small;
  var label = it.label || "";
  while (label.length > 3 && ctx.measureText(label).width > tileW() - 18) label = label.slice(0, -1);
  ctx.textAlign = "center";
  ctx.fillText(label, x + tileW() / 2, y + tileH() - (it.sub ? 8 : 8));
  ctx.textAlign = "left";

  // HDMI / Input live signal indicator badge
  if (it.sub) {
    var hasSig = !!it.signal;
    var dotX = x + 16, dotY = y + tileH() - 22;
    if (hasSig) {
      ctx.fillStyle = "rgba(34, 197, 94, 0.25)";
      ctx.beginPath();
      ctx.arc(dotX, dotY, 6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = hasSig ? "#22c55e" : "#64748b";
    ctx.beginPath();
    ctx.arc(dotX, dotY, 3.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = "600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    ctx.fillStyle = hasSig ? (focused ? "#4ade80" : "#22c55e") : (focused ? "#94a3b8" : "#64748b");
    ctx.fillText(hasSig ? "LIVE" : "STANDBY", dotX + 9, dotY + 4);
  }
  ctx.restore();
}

function drawRow(idx, y, title) {
  ctx.font = F.label;
  ctx.fillStyle = "#64748b";
  ctx.fillText(title, left(), y - 12);
  var list = items(idx);
  var n = list.length;
  if (!S.hello && S.online) {
    ctx.font = F.mid; ctx.fillStyle = "#64748b";
    ctx.fillText("loading…", left(), y + 44);
    return;
  }
  if (n === 0) {
    ctx.font = F.mid; ctx.fillStyle = "#475569";
    ctx.fillText(idx === 0 ? "no inputs reported" : "no apps reported", left(), y + 44);
    return;
  }
  var start = rowStart(idx);
  var rowActive = (S.row === idx);
  for (var i = start; i < Math.min(n, start + PAGE); i++) {
    var x = left() + (i - start) * (tileW() + gap());
    var focused = (rowActive && S.col === i);
    var hk = rowActive && i < 9 ? (i + 1) : 0;
    if (!focused) drawTile(x, y, false, list[i], hk);
    HIT.push({ x: x, y: y, w: tileW(), h: tileH(), row: idx, col: i });
  }
  if (rowActive && S.col >= start && S.col < Math.min(n, start + PAGE)) {
    drawTile(left() + (S.col - start) * (tileW() + gap()), y, true, list[S.col], S.col < 9 ? S.col + 1 : 0);
  }
  ctx.font = F.small;
  ctx.fillStyle = "#475569";
  var end = Math.min(n, start + PAGE);
  if (start > 0) ctx.fillText("‹ " + start, left() - 2, y + 24);
  if (end < n) ctx.fillText((n - end) + " ›", left() + PAGE * (tileW() + gap()) - 30, y + 24);
}

var lastDrawnMinute = -1;

function draw() {
  HIT = [];
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";

  var key = S.row + ":" + S.col;
  if (key !== lastFocusKey) { lastFocusKey = key; focusAnim = 0; }

  // 2026 Deep OLED Background with Ambient Mesh Bloom
  ctx.fillStyle = "#07090e";
  ctx.fillRect(0, 0, W, H);

  if (BG && BG.complete && BG.naturalWidth) {
    var sc = Math.max(W / BG.naturalWidth, H / BG.naturalHeight);
    ctx.drawImage(BG, (W - BG.naturalWidth * sc) / 2, (H - BG.naturalHeight * sc) / 2,
                  BG.naturalWidth * sc, BG.naturalHeight * sc);
    ctx.fillStyle = "rgba(5,7,12,0.45)";
    ctx.fillRect(0, 0, W, H);
  } else {
    // Ethereal top ambient radial bloom
    var amb = ctx.createRadialGradient(W / 2, -30, 20, W / 2, 140, W * 0.7);
    amb.addColorStop(0, "rgba(56, 189, 248, 0.08)");
    amb.addColorStop(0.5, "rgba(99, 102, 241, 0.04)");
    amb.addColorStop(1, "rgba(7, 9, 14, 0)");
    ctx.fillStyle = amb;
    ctx.fillRect(0, 0, W, H);
  }

  // Smooth perimeter vignette
  var vig = ctx.createRadialGradient(W / 2, H / 2, W * 0.35, W / 2, H / 2, W * 0.72);
  vig.addColorStop(0, "rgba(0, 0, 0, 0)");
  vig.addColorStop(1, "rgba(0, 0, 0, 0.4)");
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  // 2026 Header: 300-weight clock & uppercase tracked date
  var now = new Date();
  lastDrawnMinute = now.getMinutes();
  function p2(n) { return (n < 10 ? "0" : "") + n; }

  ctx.fillStyle = "#f8fafc";
  ctx.font = F.clock;
  ctx.fillText(p2(now.getHours()) + ":" + p2(now.getMinutes()), left(), 80);

  ctx.font = "600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
  ctx.fillStyle = "#94a3b8";
  var days = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
  var mons = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
  ctx.fillText(days[now.getDay()] + " · " + mons[now.getMonth()] + " " + now.getDate(), left() + 2, 104);

  // Top-Right Glass Capsule Status Pill
  var pillW = 144, pillH = 30, pillX = W - left() - pillW, pillY = 50;
  ctx.fillStyle = "rgba(255, 255, 255, 0.04)";
  roundRect(pillX, pillY, pillW, pillH, 15);
  ctx.fill();
  ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
  roundRect(pillX - 0.5, pillY - 0.5, pillW + 1, pillH + 1, 15.5);
  ctx.fill();
  ctx.fillStyle = "rgba(15, 23, 42, 0.95)";
  roundRect(pillX, pillY, pillW, pillH, 15);
  ctx.fill();

  var dotColor = S.online ? "#22c55e" : (S.hello ? "#f59e0b" : "#ef4444");
  var dotGlow = S.online ? "rgba(34, 197, 94, 0.3)" : "rgba(239, 68, 68, 0.3)";
  ctx.fillStyle = dotGlow;
  ctx.beginPath();
  ctx.arc(pillX + 16, pillY + pillH / 2, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = dotColor;
  ctx.beginPath();
  ctx.arc(pillX + 16, pillY + pillH / 2, 3.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.font = "600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
  ctx.fillStyle = S.online ? "#e2e8f0" : "#94a3b8";
  ctx.fillText(S.online ? "ALVIDAA · LIVE" : (S.hello ? "RECONNECTING" : "OFFLINE"), pillX + 28, pillY + pillH / 2 + 4);

  drawRow(0, 168, "INPUTS & SOURCES");
  drawRow(1, 298, "APPS & CHANNELS");

  if (installVisible()) {
    var iy = 434;
    ctx.font = F.label;
    ctx.fillStyle = "#64748b";
    ctx.fillText("SYSTEM SETUP", left(), iy - 12);
    var focused = (S.row === 2);
    drawTile(left(), iy, focused,
      { label: "INSTALL AS APP", install: true, sub: "", icon: null, val: null }, 0);
    HIT.push({ x: left(), y: iy, w: tileW(), h: tileH(), row: 2, col: 0 });
  }

  // 2026 Floating Glass Pill for Auto-switch countdown & toasts
  var nowMs = Date.now();
  if (S.autoSwitchAt > nowMs && S.autoSwitchId) {
    var rem = Math.max(1, Math.ceil((S.autoSwitchAt - nowMs) / 1000));
    var msg = "Switching to " + S.autoSwitchName + " in " + rem + "s… (press any key to stay)";
    ctx.font = F.mid;
    var mw = ctx.measureText(msg).width;
    var bx = (W - mw) / 2 - 20, by = H - 36, bw = mw + 40, bh = 28;
    ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
    roundRect(bx, by, bw, bh, 14);
    ctx.fill();
    ctx.fillStyle = "rgba(56, 189, 248, 0.25)";
    roundRect(bx - 1, by - 1, bw + 2, bh + 2, 15);
    ctx.fill();
    ctx.fillStyle = "#38bdf8";
    ctx.textAlign = "center";
    ctx.fillText(msg, W / 2, H - 17);
    ctx.textAlign = "left";
  } else if (nowMs < S.toastUntil && S.toast) {
    var tmsg = S.toast === "…" ? "working…" : S.toast;
    ctx.font = F.mid;
    var tmw = ctx.measureText(tmsg).width;
    var tbx = (W - tmw) / 2 - 20, tby = H - 36, tbw = tmw + 40, tbh = 28;
    ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
    roundRect(tbx, tby, tbw, tbh, 14);
    ctx.fill();
    ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
    roundRect(tbx - 1, tby - 1, tbw + 2, tbh + 2, 15);
    ctx.fill();
    ctx.fillStyle = "#f8fafc";
    ctx.textAlign = "center";
    ctx.fillText(tmsg, W / 2, H - 17);
    ctx.textAlign = "left";
  }
}

// Idle timer: only redraw when the minute ticks over, a toast expires, or auto-switch counts down
setInterval(function () {
  var now = new Date();
  var nowMs = now.getTime();
  if (S.autoSwitchAt) {
    if (nowMs >= S.autoSwitchAt) {
      var sid = S.autoSwitchId;
      S.autoSwitchAt = 0;
      S.autoSwitchId = null;
      act("source", sid);
    } else {
      draw();
    }
    return;
  }
  if (S.toast && nowMs >= S.toastUntil) {
    S.toast = "";
    S.busy = false;
    draw();
    return;
  }
  if (now.getMinutes() !== lastDrawnMinute) {
    draw();
  }
}, 1000);

// ---------------------------------------------------------------- input
function activate(row, col) {
  if (row === 2) { installAsApp(); return; }
  var it = items(row)[col];
  if (!it) return;
  if (it.shortcut) {
    saveLastUsed(row, it.shortcut);
    location.href = it.shortcut;
    return;
  }
  act(row === 0 ? "source" : "launch", it.val);
}

document.addEventListener("keydown", function (e) {
  S.userInteracted = true;
  if (S.autoSwitchAt) {
    cancelAutoSwitch();
    e.preventDefault();
    return;
  }
  var rows = installVisible() ? 3 : 2;
  var list = items(S.row);
  if (e.key === "ArrowRight") { S.focusPicked = true; if (S.col < list.length - 1) { S.col++; bumpFocus(); draw(); } }
  else if (e.key === "ArrowLeft") { S.focusPicked = true; if (S.col > 0) { S.col--; bumpFocus(); draw(); } }
  else if (e.key === "ArrowUp") { S.focusPicked = true; if (S.row > 0) { S.row--; clampFocus(); bumpFocus(); draw(); } }
  else if (e.key === "ArrowDown") { S.focusPicked = true; if (S.row < rows - 1) { S.row++; clampFocus(); bumpFocus(); draw(); } }
  else if (e.key === "Enter") { activate(S.row, S.col); }
  else if (e.key >= "1" && e.key <= "9") {
    var idx = e.key.charCodeAt(0) - 49;
    if (idx < list.length) {
      S.focusPicked = true;
      S.col = idx;
      bumpFocus();
      draw();
      activate(S.row, idx);
    }
  } else if (e.key === "0" || e.key === "Home") {
    S.focusPicked = true;
    S.row = 0; S.col = 0; bumpFocus(); draw();
  }
  e.preventDefault();
});

function hitAt(cx, cy) {
  var r = cv.getBoundingClientRect();
  var x = (cx - r.left) * (W / r.width);
  var y = (cy - r.top) * (H / r.height);
  for (var i = 0; i < HIT.length; i++) {
    var t = HIT[i];
    if (x >= t.x && x <= t.x + t.w && y >= t.y && y <= t.y + t.h) return t;
  }
  return null;
}
cv.addEventListener("click", function (e) {
  S.userInteracted = true;
  if (S.autoSwitchAt) { cancelAutoSwitch(); return; }
  var t = hitAt(e.clientX, e.clientY);
  if (!t) return;
  S.focusPicked = true;
  S.row = t.row; S.col = t.col; draw();
  activate(t.row, t.col);
});
cv.addEventListener("mousemove", function (e) {
  var t = hitAt(e.clientX, e.clientY);
  if (t && t.row !== 2 && (S.row !== t.row || S.col !== t.col)) {
    S.userInteracted = true;
    if (S.autoSwitchAt) cancelAutoSwitch();
    S.focusPicked = true;
    S.row = t.row; S.col = t.col; bumpFocus(); draw();
  }
});

// ---------------------------------------------------------------- install
var APP_ENTRY_ID = "vidaa-home";
var APP_URL = location.href.split("#")[0];

function installAsApp() {
  var b = detectBridge();
  var icon = APP_URL + "icon.png";
  if (b.hiutils) {
    try {
      var cur = HiUtils_createRequest("fileRead", { path: "websdk/Appinfo.json", mode: 6 });
      var list = cur.ret ? JSON.parse(cur.msg) : { AppInfo: [] };
      if (!list.AppInfo) list.AppInfo = [];
      var kept = [];
      for (var k = 0; k < list.AppInfo.length; k++) {
        var e0 = list.AppInfo[k];
        if (e0.Id === APP_ENTRY_ID) continue;
        if ((e0.AppName === "Home" || e0.Title === "Home") && e0.URL !== APP_URL) continue;
        kept.push(e0);
      }
      list.AppInfo = kept;
      var entry = {
        Id: APP_ENTRY_ID, AppName: "Home", Title: "Home",
        URL: APP_URL, StartCommand: APP_URL,
        IconURL: icon, Icon_96: icon, Image: icon, Thumb: icon,
        Type: "Browser", InstallTime: new Date().toISOString().split("T")[0],
        RunTimes: 0, StoreType: "custom", PreInstall: false
      };
      var idx = -1;
      for (var i = 0; i < list.AppInfo.length; i++) {
        if (list.AppInfo[i].Id === APP_ENTRY_ID) { idx = i; break; }
      }
      if (idx >= 0) list.AppInfo[idx] = entry; else list.AppInfo.push(entry);
      var res = HiUtils_createRequest("fileWrite", {
        path: "websdk/Appinfo.json", mode: 6, writedata: JSON.stringify(list)
      });
      if (res.ret) {
        S.installed = true;
        S.toast = "installed! restart the TV, then open Home";
        S.toastUntil = Date.now() + 8000;
      } else {
        S.toast = "install failed: " + (res.msg || "?");
        S.toastUntil = Date.now() + 5000;
      }
    } catch (e) {
      S.toast = "install error: " + e;
      S.toastUntil = Date.now() + 5000;
    }
  } else if (b.legacy) {
    try {
      Hisense_installApp(APP_ENTRY_ID, "Home", icon, icon, icon, APP_URL, "custom", function (r) {
        S.installed = (r === 0 || r === "0");
        S.toast = S.installed ? "installed! restart the TV" : "install failed (" + r + ")";
        S.toastUntil = Date.now() + 8000;
      });
    } catch (e) {
      S.toast = "install error: " + e;
      S.toastUntil = Date.now() + 5000;
    }
  }
  draw();
}

loadCache();
window.onerror = function (msg, src, line) {
    try {
      var x = new XMLHttpRequest();
      x.open("POST", "http://" + (location.host || "192.168.0.85:8770") + "/api/probe", true);
      x.setRequestHeader("Content-Type", "application/json");
      x.send(JSON.stringify({ tag: "tv-error", msg: String(msg), line: line, t: Date.now() }));
    } catch (e2) {}
    try {
      ctx.fillStyle = "#e11d48";
      ctx.font = "18px sans-serif";
      ctx.fillText("ERR: " + String(msg).slice(0, 60) + " @" + line, 20, 30);
    } catch (e3) {}
    return false;
  };

connect();
draw();
</script>
